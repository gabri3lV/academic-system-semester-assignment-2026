name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Build project
        working-directory: academic-system
        run: mvn compile --batch-mode

      - name: Run all automated tests
        working-directory: academic-system
        run: mvn test --batch-mode -Dnet.bytebuddy.experimental=true
