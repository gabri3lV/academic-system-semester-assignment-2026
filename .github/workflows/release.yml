name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Build project
        working-directory: academic-system
        run: mvn compile --batch-mode

      - name: Run all automated tests
        working-directory: academic-system
        run: mvn test --batch-mode -Dnet.bytebuddy.experimental=true

      - name: Package release artifact
        working-directory: academic-system
        run: mvn package -DskipTests --batch-mode

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Academic System ${{ github.ref_name }}"
          body: |
            ## Academic System ${{ github.ref_name }}

            ### Download
            Faça o download do JAR abaixo e execute com:
            ```bash
            java -jar academic-system-*.jar
            ```
            Ou use Docker:
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker run -it ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          files: |
            academic-system/target/academic-system-*.jar
          draft: false
          prerelease: false
