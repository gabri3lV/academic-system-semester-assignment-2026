# =============================================================
# TUS-2418 - Configure pull request validation workflow
#
# Valida automaticamente todo pull request: compila o projeto
# e executa todos os testes. Falha em erros de compilação ou
# testes, bloqueando o merge (via branch protection - TUS-2420).
# =============================================================

name: PR Validation

on:
  # AC1 (TUS-2418): dispara ao criar ou atualizar um pull request
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      # AC2, AC3, AC4, AC5 (TUS-2418):
      # - compila o projeto (falha em erro de compilação → AC4)
      # - executa todos os testes automatizados (falha se qualquer teste falhar → AC5)
      # --batch-mode suprime saída interativa no log do Actions
      - name: Build project
        run: mvn compile --batch-mode

      - name: Run all automated tests
        run: mvn test --batch-mode -Dnet.bytebuddy.experimental=true
